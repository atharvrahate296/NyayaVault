version: "3.8"

services:
  # 1. Frontend: React + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  # 2. Backend: FastAPI
  # Relational database is Supabase (managed cloud PostgreSQL).
  # Configure DATABASE_URL, SUPABASE_URL and SUPABASE_ANON_KEY in backend/.env.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - STORAGE_PROVIDER=minio
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_PUBLIC_ENDPOINT=http://localhost:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=nyayavault-documents
      - STORAGE_BACKUP_BUCKET=nyayavault-canonical
      - STORAGE_ADDRESSING_STYLE=path
      - STORAGE_CREATE_BUCKET=false
      - BLOCKCHAIN_NETWORK=hyperledger-fabric
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - ./backend/.env

  # 3. Secure Object Storage: MinIO
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Create the application bucket outside the FastAPI startup lifecycle.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command: >-
      -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/nyayavault-documents;
      mc mb --ignore-existing local/nyayavault-canonical"

  # 4. Vector Database: Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"   # REST API & Web Dashboard
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # 5. Task Broker & Cache: Redis
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  minio_data:
  qdrant_data:
  redis_data:
